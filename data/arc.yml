# The four-step transformational arc. Order is fixed: Clear → Receive → Steward → Act.
- n: 1
  name: "Clear"
  accent: "var(--sw-clear)"
  desc: "Make space in your life to understand what you truly want"
- n: 2
  name: "Receive"
  accent: "var(--sw-receive)"
  desc: "Give yourself permission to relish the benefits of your actions"
- n: 3
  name: "Steward"
  accent: "var(--sw-steward)"
  desc: "Confidently tend the flows that move through your life"
- n: 4
  name: "Act"
  accent: "var(--sw-act)"
  desc: "Move from the steady foundation of a still centre"
